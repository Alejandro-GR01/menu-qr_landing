          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f67e124]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f67e125]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f67e126]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f67e130]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f67e131]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f67e132]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f67e136]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f67e137]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f67e138]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f67e142]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f67e143]:
          - button "¿Y si se corta el internet del local?" [ref=f67e144]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f67e148]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f67e149]:
          - button "¿Cómo recibo la app?" [ref=f67e150]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f67e154]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f67e155]:
          - button "¿Se puede imprimir tickets?" [ref=f67e156]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f67e160]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f67e161]:
          - button "¿Qué es el POS de vendedor?" [ref=f67e162]
          - region "¿Qué es el POS de vendedor?":
            - paragraph [ref=f67e166]: Es un punto de venta integrado para que el vendedor cobre desde su celular o tablet en la red local. Sin hardware adicional, sin suscripciones.
