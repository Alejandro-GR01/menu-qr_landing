          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f50e404]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f50e405]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f50e406]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f50e410]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f50e411]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f50e412]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f50e416]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f50e417]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f50e418]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f50e422]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f50e423]:
          - button "¿Y si se corta el internet del local?" [ref=f50e424]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f50e428]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f50e429]:
          - button "¿Cómo recibo la app?" [ref=f50e430]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f50e434]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f50e435]:
          - button "¿Se puede imprimir tickets?" [ref=f50e436]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f50e440]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f50e441]:
