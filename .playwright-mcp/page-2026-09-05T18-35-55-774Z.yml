        - generic [ref=f26e1515]:
          - button "¿Necesito conexión a internet?" [ref=f26e1516]
          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f26e1520]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f26e1521]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f26e1522]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f26e1526]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f26e1527]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f26e1528]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f26e1532]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f26e1533]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f26e1534]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f26e1538]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f26e1539]:
          - button "¿Y si se corta el internet del local?" [ref=f26e1540]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f26e1544]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f26e1545]:
          - button "¿Cómo recibo la app?" [ref=f26e1546]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f26e1550]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f26e1551]:
          - button "¿Se puede imprimir tickets?" [ref=f26e1552]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f26e1556]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f26e1557]:
          - button "¿Qué es el POS de vendedor?" [ref=f26e1558]
          - region "¿Qué es el POS de vendedor?":
            - paragraph [ref=f26e1562]: Es un punto de venta integrado para que el vendedor cobre desde su celular o tablet en la red local. Sin hardware adicional, sin suscripciones.
