          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f62e132]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f62e133]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f62e134]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f62e138]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f62e139]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f62e140]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f62e144]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f62e145]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f62e146]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f62e150]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f62e151]:
          - button "¿Y si se corta el internet del local?" [ref=f62e152]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f62e156]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f62e157]:
          - button "¿Cómo recibo la app?" [ref=f62e158]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f62e162]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f62e163]:
          - button "¿Se puede imprimir tickets?" [ref=f62e164]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f62e168]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f62e169]:
          - button "¿Qué es el POS de vendedor?" [ref=f62e170]
          - region "¿Qué es el POS de vendedor?":
            - paragraph [ref=f62e174]: Es un punto de venta integrado para que el vendedor cobre desde su celular o tablet en la red local. Sin hardware adicional, sin suscripciones.
