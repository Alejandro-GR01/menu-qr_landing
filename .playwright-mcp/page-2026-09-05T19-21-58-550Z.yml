          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f47e465]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f47e466]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f47e467]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f47e471]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f47e472]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f47e473]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f47e477]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f47e478]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f47e479]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f47e483]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f47e484]:
          - button "¿Y si se corta el internet del local?" [ref=f47e485]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f47e489]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f47e490]:
          - button "¿Cómo recibo la app?" [ref=f47e491]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f47e495]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f47e496]:
          - button "¿Se puede imprimir tickets?" [ref=f47e497]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f47e501]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f47e502]:
