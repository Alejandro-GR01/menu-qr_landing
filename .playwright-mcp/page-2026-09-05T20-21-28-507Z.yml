          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f2e132]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f2e133]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f2e134]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f2e138]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f2e139]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f2e140]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f2e144]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f2e145]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f2e146]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f2e150]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f2e151]:
          - button "¿Y si se corta el internet del local?" [ref=f2e152]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f2e156]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f2e157]:
          - button "¿Cómo recibo la app?" [ref=f2e158]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f2e162]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f2e163]:
          - button "¿Se puede imprimir tickets?" [ref=f2e164]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f2e168]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f2e169]:
          - button "¿Qué es el POS de vendedor?" [ref=f2e170]
          - region "¿Qué es el POS de vendedor?":
            - paragraph [ref=f2e174]: Es un punto de venta integrado para que el vendedor cobre desde su celular o tablet en la red local. Sin hardware adicional, sin suscripciones.
