        - generic [ref=f26e1976]:
          - button "¿Necesito conexión a internet?" [ref=f26e1977]
          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f26e1981]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f26e1982]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f26e1983]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f26e1987]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f26e1988]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f26e1989]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f26e1993]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f26e1994]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f26e1995]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f26e1999]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f26e2000]:
          - button "¿Y si se corta el internet del local?" [ref=f26e2001]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f26e2005]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f26e2006]:
          - button "¿Cómo recibo la app?" [ref=f26e2007]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f26e2011]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f26e2012]:
          - button "¿Se puede imprimir tickets?" [ref=f26e2013]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f26e2017]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f26e2018]:
          - button "¿Qué es el POS de vendedor?" [ref=f26e2019]
          - region "¿Qué es el POS de vendedor?":
            - paragraph [ref=f26e2023]: Es un punto de venta integrado para que el vendedor cobre desde su celular o tablet en la red local. Sin hardware adicional, sin suscripciones.
