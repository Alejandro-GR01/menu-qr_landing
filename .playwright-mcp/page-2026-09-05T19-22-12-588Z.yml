          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f48e124]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f48e125]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f48e126]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f48e130]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f48e131]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f48e132]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f48e136]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f48e137]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f48e138]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f48e142]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f48e143]:
          - button "¿Y si se corta el internet del local?" [ref=f48e144]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f48e148]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f48e149]:
          - button "¿Cómo recibo la app?" [ref=f48e150]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f48e154]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f48e155]:
          - button "¿Se puede imprimir tickets?" [ref=f48e156]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f48e160]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f48e161]:
