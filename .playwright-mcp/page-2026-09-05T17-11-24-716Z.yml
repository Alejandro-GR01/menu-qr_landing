          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f4e399]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f4e400]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f4e401]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f4e405]: No. Se descarga el instalador, se abre, y configurás el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f4e406]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f4e407]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f4e411]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f4e412]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f4e413]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f4e417]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f4e418]:
          - button "¿Y si se corta el internet del local?" [ref=f4e419]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f4e423]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f4e424]:
          - button "¿Cómo recibo la app?" [ref=f4e425]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f4e429]: Contactás por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalás en la PC del local y en minutos tenés el menú funcionando.
        - generic [ref=f4e430]:
          - button "¿Se puede imprimir tickets?" [ref=f4e431]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f4e435]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f4e436]:
