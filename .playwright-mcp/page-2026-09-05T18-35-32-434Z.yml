        - generic [ref=f26e408]:
          - button "¿Necesito conexión a internet?" [ref=f26e409]
          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f26e413]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f26e414]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f26e415]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f26e419]: No. Se descarga el instalador, se abre, y configuras el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f26e420]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f26e421]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f26e425]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f26e426]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f26e427]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f26e431]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f26e432]:
          - button "¿Y si se corta el internet del local?" [ref=f26e433]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f26e437]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f26e438]:
          - button "¿Cómo recibo la app?" [ref=f26e439]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f26e443]: Contactas por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalas en la PC del local y en minutos tienes el menú funcionando.
        - generic [ref=f26e444]:
          - button "¿Se puede imprimir tickets?" [ref=f26e445]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f26e449]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
        - generic [ref=f26e450]:
          - button "¿Qué es el POS de vendedor?" [ref=f26e451]
          - region "¿Qué es el POS de vendedor?":
            - paragraph [ref=f26e455]: Es un punto de venta integrado para que el vendedor cobre desde su celular o tablet en la red local. Sin hardware adicional, sin suscripciones.
