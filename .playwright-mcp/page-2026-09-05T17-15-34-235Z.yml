          - region "¿Necesito conexión a internet?":
            - paragraph [ref=f6e401]: No. Todo funciona en la red local de tu negocio — la PC del local hace de servidor y los clientes se conectan por WiFi. Sin nube, sin dependencia de ningún servicio externo.
        - generic [ref=f6e402]:
          - button "¿Necesito saber programar o instalar servidores?" [ref=f6e403]
          - region "¿Necesito saber programar o instalar servidores?":
            - paragraph [ref=f6e407]: No. Se descarga el instalador, se abre, y configurás el menú desde un panel visual intuitivo. Sin código, sin terminal, sin conocimientos técnicos.
        - generic [ref=f6e408]:
          - button "¿Cómo acceden los clientes al menú?" [ref=f6e409]
          - region "¿Cómo acceden los clientes al menú?":
            - paragraph [ref=f6e413]: Escanean el QR que genera la app con la cámara de su celular. Sin apps, sin registros, sin datos personales. Abren el navegador y ven el menú al instante.
        - generic [ref=f6e414]:
          - button "¿Cuánto cuesta? ¿Hay mensualidad?" [ref=f6e415]
          - region "¿Cuánto cuesta? ¿Hay mensualidad?":
            - paragraph [ref=f6e419]: Pago único. Sin suscripción, sin hosting, sin costos de servidor. Pagás una vez y la app es tuya para siempre.
        - generic [ref=f6e420]:
          - button "¿Y si se corta el internet del local?" [ref=f6e421]
          - region "¿Y si se corta el internet del local?":
            - paragraph [ref=f6e425]: El menú sigue funcionando igual, porque se sirve desde la PC del local por la red local. Mientras haya luz y la PC esté encendida, todo funciona.
        - generic [ref=f6e426]:
          - button "¿Cómo recibo la app?" [ref=f6e427]
          - region "¿Cómo recibo la app?":
            - paragraph [ref=f6e431]: Contactás por el email del desarrollador y te coordina la entrega del instalador para Windows (.exe). Lo instalás en la PC del local y en minutos tenés el menú funcionando.
        - generic [ref=f6e432]:
          - button "¿Se puede imprimir tickets?" [ref=f6e433]
          - region "¿Se puede imprimir tickets?":
            - paragraph [ref=f6e437]: Sí. La app incluye un POS integrado que permite imprimir tickets de venta y cobro, incluso con impresora térmica.
